name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name FR3DO --add-data "assets;assets"
          --collect-all SpotipyFree --collect-all spotapi
          --collect-all curl_cffi --collect-all yt_dlp main.py
      - name: Archive
        shell: pwsh
        run: |
          Copy-Item README.md dist/FR3DO/README.md
          Copy-Item -Recurse docs dist/FR3DO/docs
          Compress-Archive -Path dist/FR3DO -DestinationPath dist/FR3DO-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FR3DO-Windows
          path: dist/FR3DO-Windows.zip
      - name: Publish v0.2.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.2.0 *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create v0.2.0 dist/FR3DO-Windows.zip --target $env:GITHUB_SHA --title "FR3DO Crystal 0.2.0" --notes "Interfaz Crystal con tres paletas. YouTube y SoundCloud; importación Spotify pública sin Client ID. Requiere FFmpeg en PATH. Descomprime la carpeta completa y ejecuta FR3DO.exe."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
